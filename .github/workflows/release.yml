name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Node tests
        run: npm test

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  build:
    name: Build (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            artifact: Dispatch-macOS-Silicon
            paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            artifact: Dispatch-macOS-Intel
            paths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - label: Windows
            os: windows-latest
            bundles: msi,nsis
            args: --bundles msi,nsis
            artifact: Dispatch-Windows
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            args: --bundles deb,rpm,appimage
            artifact: Dispatch-Linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config unzip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - run: npm ci

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Dispatch v__VERSION__'
          releaseBody: 'See the assets to download and install this version of Dispatch.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}

  server:
    name: dispatch-server (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: server

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl) name=dispatch-server-linux-x64;  file=dispatch-server;;
            aarch64-apple-darwin)      name=dispatch-server-macos-arm64; file=dispatch-server;;
            x86_64-apple-darwin)       name=dispatch-server-macos-x64;  file=dispatch-server;;
            x86_64-pc-windows-msvc)    name=dispatch-server-windows-x64; file=dispatch-server.exe;;
          esac
          cp "server/target/${{ matrix.target }}/release/$file" "out/$name"

      - name: Attach to GitHub release (tagged runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/dispatch-server-*
          fail_on_unmatched_files: true

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-server-${{ matrix.target }}
          path: out/dispatch-server-*

  merge-artifacts:
    name: Merge artifacts (manual runs)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: Dispatch-builds
          delete-merged: true